<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sample HTML form</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
  form { display: grid; gap: .75rem; }
  label { display: flex; flex-direction: column; gap: .25rem; font-size: .9rem; }
  input, textarea, select { padding: .5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: .6rem 1rem; font-size: 1rem; background: #3498db; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  fieldset { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; }
</style>
</head>
<body>
<h1>Contact form</h1>
<form action="/submit" method="post" enctype="multipart/form-data">
  <label>Name<input type="text" name="name" required placeholder="Jane Doe"></label>
  <label>Email<input type="email" name="email" required placeholder="jane@example.com"></label>
  <label>Phone<input type="tel" name="phone" pattern="[0-9+\-\s]+"></label>
  <label>Country
    <select name="country">
      <option value="">— select —</option>
      <option>United States</option>
      <option>Russia</option>
      <option>Spain</option>
      <option>China</option>
    </select>
  </label>
  <fieldset>
    <legend>Subscribe</legend>
    <label><input type="radio" name="subscribe" value="yes" checked> Yes</label>
    <label><input type="radio" name="subscribe" value="no"> No</label>
  </fieldset>
  <label><input type="checkbox" name="agree" required> I agree to the terms</label>
  <label>Message<textarea name="message" rows="4" placeholder="Type your message"></textarea></label>
  <label>Attachment<input type="file" name="file"></label>
  <button type="submit">Send</button>
</form>
</body>
</html>
