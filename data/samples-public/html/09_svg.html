<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sample HTML with inline SVG</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; text-align: center; }
  svg { max-width: 100%; height: auto; }
  .row { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin: 1rem 0; }
</style>
</head>
<body>
<h1>Inline SVG examples</h1>
<p>SVG can be embedded directly inside HTML and styled with CSS.</p>
<div class="row">
  <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Circle">
    <circle cx="60" cy="60" r="50" fill="#3498db" stroke="#2c3e50" stroke-width="4"/>
  </svg>
  <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Star">
    <polygon points="60,10 73,45 110,45 80,68 92,105 60,82 28,105 40,68 10,45 47,45"
             fill="#f1c40f" stroke="#c29d0b" stroke-width="2"/>
  </svg>
  <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Gradient square">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e74c3c"/>
        <stop offset="100%" stop-color="#9b59b6"/>
      </linearGradient>
    </defs>
    <rect x="10" y="10" width="100" height="100" rx="12" fill="url(#g)"/>
  </svg>
</div>
<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" aria-label="Bar chart">
  <g font-family="system-ui" font-size="12" fill="#333">
    <rect x="20"  y="80"  width="40" height="100" fill="#3498db"/>
    <rect x="80"  y="50"  width="40" height="130" fill="#3498db"/>
    <rect x="140" y="20"  width="40" height="160" fill="#2ecc71"/>
    <rect x="200" y="100" width="40" height="80"  fill="#3498db"/>
    <rect x="260" y="60"  width="40" height="120" fill="#3498db"/>
    <text x="40"  y="195" text-anchor="middle">Q1</text>
    <text x="100" y="195" text-anchor="middle">Q2</text>
    <text x="160" y="195" text-anchor="middle">Q3</text>
    <text x="220" y="195" text-anchor="middle">Q4</text>
    <text x="280" y="195" text-anchor="middle">Q5</text>
  </g>
</svg>
</body>
</html>
